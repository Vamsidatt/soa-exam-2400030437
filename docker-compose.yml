version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: exam_2400030437
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ${DOCKER_USERNAME}/docker-backend-2400030437:latest
    build:
      context: ./CrudService
      dockerfile: Dockerfile
    container_name: backend_app
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASS: root
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/exam_2400030437
    ports:
      - "8081:8081"

  frontend:
    image: ${DOCKER_USERNAME}/docker-frontend-2400030437:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: