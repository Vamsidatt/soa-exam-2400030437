spring.application.name=CRUDService
server.port=8081

# Dynamic DB resolution: defaults to localhost for Eclipse, resolves to db in Docker Compose
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/exam_2400030437
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs